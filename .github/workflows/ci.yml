name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - '**'

jobs:
  check-action-version:
    name: Check version used by prepare action version matches latest tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Get latest tag
        id: latest-tag
        run: |
          latest_tag=$(git tag --sort=-creatordate | head -n 1)
          echo "tag=$latest_tag" >> $GITHUB_OUTPUT
          echo "Latest tag: $latest_tag"
        shell: bash
      - name: Check prepare/action.yml references latest tag
        run: |
          referenced_sha=$(grep -A1 "ON RELEASE: Update below to the latest sha" prepare/action.yml | tail -n1 | grep -oP '@\K[^ ]+' || true)
          latest_tag="${{ steps.latest-tag.outputs.tag }}"
          latest_sha=$(git rev-list -n 1 "$latest_tag")

          echo "Referenced SHA in prepare/action.yml = $referenced_sha"
          echo "Latest tag in repo = $latest_tag (SHA: $latest_sha)"

          if [ "$referenced_sha" != "$latest_sha" ]; then
            echo "::error::SHA mismatch! prepare/action.yml references @$referenced_sha but latest tag $latest_tag is $latest_sha"
            exit 1
          fi

          echo "✓ SHA matches latest tag ($latest_tag): $referenced_sha"
        shell: bash
